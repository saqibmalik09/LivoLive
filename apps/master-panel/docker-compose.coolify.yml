# SK Live master panel — https://master.skliveparty.online
services:
  master:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    image: sklive-master-panel:local
    container_name: sklive-master-panel
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      MASTER_PANEL_PASSWORD: ${MASTER_PANEL_PASSWORD}
    networks:
      - coolify
      - supabase
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.sklive-master-gzip.compress=true
      - traefik.http.middlewares.sklive-master-https.redirectscheme.scheme=https
      - traefik.http.routers.sklive-master-http.entryPoints=http
      - traefik.http.routers.sklive-master-http.rule=Host(`master.skliveparty.online`)
      - traefik.http.routers.sklive-master-http.middlewares=sklive-master-https
      - traefik.http.routers.sklive-master-http.service=sklive-master
      - traefik.http.routers.sklive-master-https.entryPoints=https
      - traefik.http.routers.sklive-master-https.rule=Host(`master.skliveparty.online`)
      - traefik.http.routers.sklive-master-https.middlewares=sklive-master-gzip
      - traefik.http.routers.sklive-master-https.service=sklive-master
      - traefik.http.routers.sklive-master-https.tls=true
      - traefik.http.routers.sklive-master-https.tls.certresolver=letsencrypt
      - traefik.http.services.sklive-master.loadbalancer.server.port=3000

networks:
  coolify:
    external: true
  supabase:
    external: true
    name: mnq3vesx0syflb0m0bot3oa2
